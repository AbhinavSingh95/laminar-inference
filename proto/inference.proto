syntax = "proto3";

package inference;

option go_package = "github.com/AbhinavSingh95/laminar-inference/proto;inference";

// InferenceService handles batch processing of inference requests
service InferenceService {
  // ProcessBatch receives a batch of requests and returns corresponding results
  rpc ProcessBatch(BatchRequest) returns (BatchResponse) {}

  // Stream receives one request and returns token-level streaming events.
  rpc Stream(RequestItem) returns (stream StreamResponse) {}
}

// RequestItem represents a single inference request
message RequestItem {
  // Unique identifier for this request
  string id = 1;
  
  // The input prompt/data to process
  string prompt = 2;

  // Request correlation identifier propagated from the HTTP gateway
  string trace_id = 3;
}

// ResponseItem represents the result for a single request
message ResponseItem {
  // Unique identifier matching the request
  string id = 1;
  
  // The inference result
  string result = 2;

  // Correlation identifier copied from the request
  string trace_id = 3;

  // Worker backend that produced the result, for trace attribution.
  string backend_name = 4;

  // Time spent inside the worker backend for this request, in microseconds.
  int64 backend_latency_micros = 5;

  // Backend-specific inference measurements for traces and benchmark reports.
  map<string, string> backend_metadata = 6;
}

// StreamResponse represents one server-streaming inference event.
message StreamResponse {
  // Unique identifier matching the request
  string id = 1;

  // Correlation identifier copied from the request
  string trace_id = 2;

  // Event type, for example "token" or "done"
  string event_type = 3;

  // Incremental token/text delta for token events
  string delta = 4;

  // Final inference result for done events
  string result = 5;

  // Worker backend that produced the event
  string backend_name = 6;

  // Time spent inside the worker backend, in microseconds
  int64 backend_latency_micros = 7;

  // Backend-specific streaming measurements
  map<string, string> backend_metadata = 8;
}

// BatchRequest contains multiple requests to be processed together
message BatchRequest {
  // List of individual requests in this batch
  repeated RequestItem requests = 1;
}

// BatchResponse contains results for all requests in the batch
message BatchResponse {
  // List of individual responses matching the requests
  repeated ResponseItem responses = 1;
}
