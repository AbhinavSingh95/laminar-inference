<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">Laminar Inference</title>
  <desc id="desc">Minimal Laminar Inference wordmark with a wave mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3c7"/>
      <stop offset="0.58" stop-color="#8fb8a8"/>
      <stop offset="1" stop-color="#c6a15b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="978" height="218" rx="18" fill="url(#background)" stroke="#243042" stroke-width="2"/>

  <g transform="translate(82 58)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 48 C62 14 126 14 188 48 S312 82 374 48" stroke="url(#wave)" stroke-width="12"/>
    <path d="M0 86 C62 52 126 52 188 86 S312 120 374 86" stroke="#617487" stroke-width="7" opacity="0.7"/>
    <path d="M0 124 C62 90 126 90 188 124 S312 158 374 124" stroke="#d8c6a3" stroke-width="5" opacity="0.82"/>
  </g>

  <text x="508" y="127" fill="#f5efe3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="50" font-weight="700" letter-spacing="0">Laminar Inference</text>
</svg>
